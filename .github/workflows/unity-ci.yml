name: Unity CI

# Publishes the Unity 2020.1.8f1 + Blender image used by the jobs below, runs the
# EditMode test suite and compiles the project - all inside the official GameCI
# editor container. No local Unity installation is needed: the Unity version
# comes from ProjectSettings/ProjectVersion.txt and Blender comes from
# .github/docker/unity-editor-blender/, so the .blend models are imported too.
#
# GameCI pulls its editor image from a registry, so the custom image is built
# once and published to GitHub's container registry. Should that push ever fail
# (for example when a private package exceeds the storage allowance of a free
# plan), the jobs fall back to the stock Unity image with a warning instead of
# failing. Making the package public (repository > Packages > package settings)
# is free and keeps the Blender enabled image in use.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   UNITY_LICENSE  - contents of a manually activated license file (.ulf), Personal license
#   UNITY_EMAIL    - e-mail address of the Unity account
#   UNITY_PASSWORD - password of the Unity account
# Plus/Pro users set UNITY_SERIAL instead of UNITY_LICENSE.
# One-time activation steps: https://game.ci/docs/github/activation
#
# Only code that is pushed to GitHub is checked; local, uncommitted changes are
# not part of a run.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the running check obsolete.
concurrency:
  group: unity-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read # pull the CI image back out of GitHub's container registry

jobs:
  ci_image:
    name: Publish Unity + Blender image
    # Older editor images are happiest on 22.04, which also has the disk space
    # the multi-gigabyte Unity image needs.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # publish the CI image to GitHub's container registry
    outputs:
      image: ${{ steps.tag.outputs.image }}
      published: ${{ steps.published.outputs.published }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The tag carries a hash of the Dockerfile, so the published image is
      # reused until the Dockerfile changes.
      - name: Compute the image tag
        id: tag
        run: |
          HASH="$(sha256sum .github/docker/unity-editor-blender/Dockerfile | cut -c1-8)"
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/car-town-unity-ci:2020.1.8f1-blender-${HASH}"
          echo "CI_IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the image already exists
        id: exists
        run: |
          if docker manifest inspect "$CI_IMAGE" > /dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # continue-on-error keeps a failed push from skipping the test and build
      # jobs; the step below then falls back to the stock Unity image.
      - name: Build and publish the image
        if: ${{ steps.exists.outputs.present != 'true' }}
        continue-on-error: true
        run: |
          docker build --tag "$CI_IMAGE" .github/docker/unity-editor-blender
          docker push "$CI_IMAGE"

      - name: Report whether the custom image is usable
        id: published
        run: |
          if docker manifest inspect "$CI_IMAGE" > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The Unity + Blender image is not available in the registry, using the stock Unity image instead."
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  editmode-tests:
    name: EditMode tests
    needs: ci_image
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      # GameCI activates the license from these variables.
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      # `secrets` is not allowed inside `if:`, so the guard flag is derived here.
      UNITY_CI_ENABLED: ${{ secrets.UNITY_LICENSE != '' || secrets.UNITY_SERIAL != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Note missing license secret
        if: ${{ env.UNITY_CI_ENABLED != 'true' }}
        run: |
          echo "::warning::No Unity license secret configured (UNITY_LICENSE or UNITY_SERIAL), skipping Unity CI."
          {
            echo "### Unity CI skipped"
            echo ""
            echo "Add \`UNITY_LICENSE\` (a .ulf file) or \`UNITY_SERIAL\` (Plus/Pro) as a repository secret to enable it."
            echo "See https://game.ci/docs/github/activation"
          } >> "$GITHUB_STEP_SUMMARY"

      # Needed while the published image is private; a public package needs no login.
      - name: Log in to GitHub Container Registry
        if: ${{ env.UNITY_CI_ENABLED == 'true' && needs.ci_image.outputs.published == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reuses Unity's import cache between runs (roughly halves the run time).
      - name: Cache Unity Library
        if: ${{ env.UNITY_CI_ENABLED == 'true' }}
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-

      # Assets/Tests/EditMode covers CarPool and SpatialHash.
      - name: Run EditMode tests
        id: editmode-tests
        if: ${{ env.UNITY_CI_ENABLED == 'true' }}
        uses: game-ci/unity-test-runner@v4
        with:
          unityVersion: auto # -> 2020.1.8f1 from ProjectSettings/ProjectVersion.txt
          # Empty when the custom image could not be published: GameCI then uses
          # its stock editor image.
          customImage: ${{ needs.ci_image.outputs.published == 'true' && needs.ci_image.outputs.image || '' }}
          testMode: editmode
          # To also get the results as an inline check on the commit, add
          # "githubToken: ${{ secrets.GITHUB_TOKEN }}" here, grant this workflow
          # "checks: write" and set Settings > Actions > General > Workflow
          # permissions to read and write. Without it the results are uploaded
          # as an artifact instead.

      - name: Upload test results
        if: always() && env.UNITY_CI_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EditMode test results
          path: ${{ steps.editmode-tests.outputs.artifactsPath }}
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Compile & build project
    needs: ci_image
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_CI_ENABLED: ${{ secrets.UNITY_LICENSE != '' || secrets.UNITY_SERIAL != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Note missing license secret
        if: ${{ env.UNITY_CI_ENABLED != 'true' }}
        run: echo "::warning::No Unity license secret configured (UNITY_LICENSE or UNITY_SERIAL), skipping the compile check."

      - name: Log in to GitHub Container Registry
        if: ${{ env.UNITY_CI_ENABLED == 'true' && needs.ci_image.outputs.published == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Unity Library
        if: ${{ env.UNITY_CI_ENABLED == 'true' }}
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-

      # A build runs the full script compilation, so compiler errors fail the job.
      - name: Build project
        if: ${{ env.UNITY_CI_ENABLED == 'true' }}
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: auto
          customImage: ${{ needs.ci_image.outputs.published == 'true' && needs.ci_image.outputs.image || '' }}
          targetPlatform: StandaloneLinux64
          allowDirtyBuild: true # Unity creates the missing .meta files during import

      # Optional: publish the built player. Enable it if you want the artifact,
      # keeping in mind that artifact storage is limited on free plans.
      # - name: Upload build
      #   if: ${{ env.UNITY_CI_ENABLED == 'true' }}
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: StandaloneLinux64
      #     path: build/StandaloneLinux64
      #     retention-days: 7
